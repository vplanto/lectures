<!DOCTYPE html>
<html lang="{{ page.lang | default: "uk" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Lectures" }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-light.min.css">

  <style>
    body,
    .markdown-body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      color: #1a1a1a;
    }

    .markdown-body pre,
    .markdown-body code,
    .markdown-body kbd,
    .markdown-body samp,
    pre, code, kbd, samp {
      font-family: 'IBM Plex Mono', 'Lilex', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
    }

    .markdown-body code:not(pre code) {
      padding: 0.2em 0.4em;
      border-radius: 4px;
      background-color: rgba(0, 0, 0, 0.05);
    }

    /* Центрування сторінки */
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }
    @media (max-width: 767px) { .markdown-body { padding: 15px; } }
  </style>

  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <article class="markdown-body">
    {{ content }}
  </article>
  <footer style="max-width:980px;margin:0 auto;padding:0 45px 30px;font-size:0.85em;color:#57606a;border-top:1px solid #d0d7de;">
  <p>
    <a href="{{ '/DISCLAIMER.html' | relative_url }}">Академічна доброчесність</a>
    · <a href="{{ '/en/DISCLAIMER.html' | relative_url }}">Academic Integrity</a>
    · <a href="{{ '/methodology.html' | relative_url }}">НМК</a>
  </p>
  </footer>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

    // Налаштування
    mermaid.initialize({ startOnLoad: false });

    // Знаходимо всі блоки коду з мовою mermaid і перетворюємо їх
    document.addEventListener('DOMContentLoaded', () => {
      const mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');

      mermaidBlocks.forEach((block) => {
        // Отримуємо сам код діаграми
        const content = block.textContent;
        // Створюємо новий div
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = content;

        // Замінюємо <pre><code> на <div class="mermaid">
        const pre = block.closest('pre');
        if (pre) {
          pre.parentNode.replaceChild(div, pre);
        }
      });

      // Запускаємо рендер
      mermaid.run();
    });
  </script>
</body>
</html>
